name: Apply unpackaged checkbox patch
on:
  push:
    branches: [feature/unpackaged-disable-registration-path]
    paths: [.github/workflows/apply-unpackaged-checkbox.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unpackaged-disable-registration-path
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - shell: pwsh
        run: python .github/scripts/apply-unpackaged-checkbox.py
      - shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Raven/Views/AppPage.xaml Raven/Views/AppPage.xaml.cs
          git commit -m "Add opt-in no-registration PATH mode"
          git push

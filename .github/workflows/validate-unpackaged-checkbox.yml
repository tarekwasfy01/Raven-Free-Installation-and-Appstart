name: Validate unpackaged checkbox
on:
  push:
    branches: [feature/unpackaged-disable-registration-path]
    paths: [.github/workflows/validate-unpackaged-checkbox.yml]
permissions:
  contents: read
jobs:
  build-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: dotnet restore Raven/Raven.csproj -r win-x64 --source https://api.nuget.org/v3/index.json
      - shell: pwsh
        run: dotnet publish Raven/Raven.csproj -c Release -r win-x64 --self-contained true --no-restore -p:Platform=x64 -p:WindowsAppSDKSelfContained=true -p:PublishSingleFile=false -p:DebugType=None -p:DebugSymbols=false -o OUTPUT/Raven-x64
